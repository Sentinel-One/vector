[package]
name = "jaqwasm"
version = "0.1.0"
authors = ["Observo <observo-all@observo.ai>"]
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
wasmtime = { version = "27", default-features = false, features = ["cranelift", "runtime"] }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
ciborium = "0.2"
serde_json = "1"
